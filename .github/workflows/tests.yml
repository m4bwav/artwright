# Checks the skills' structure, links, knowledge flags and public-safety guards, runs the offline aw.py tests and
# the size budget on the three operating systems, on the oldest and newest Python supported, with and without
# Pillow. The 3.9 Linux job is pinned to ubuntu-24.04: ubuntu-latest moves to 26.04, which has no 3.9 build.
name: tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.14"]
        exclude:
          - os: ubuntu-latest
            python: "3.9"
        include:
          - os: ubuntu-24.04
            python: "3.9"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: skills, links, knowledge flags, LF endings and the key and path guards
        run: python tests/check_skills.py
      - name: aw.py tests, standard library only
        run: python tests/test_aw.py
      - name: aw.py tests with Pillow
        if: matrix.python == '3.14'
        run: |
          python -m pip install --quiet pillow
          python tests/test_aw.py
      - name: size budget
        run: python scripts/budget.py
